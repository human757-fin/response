name: Restart Response on Pterodactyl

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: response-production-deploy
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on Python 3.12
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate services
        env:
          DATABASE_PATH: /tmp/response-actions.db
        run: |
          python -m py_compile bot.py webpanel.py response_core.py response_cards.py
          python -m unittest discover -s tests -v
          python -c "import bot; names={command.name for command in bot.bot.tree.get_commands()}; assert {'mod','voice','sfx'} <= names; assert len(names) == 18"

  restart:
    name: Restart server (startup auto-pulls)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate deployment secrets
        env:
          PTERODACTYL_URL: ${{ secrets.PTERODACTYL_URL }}
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
        run: |
          test -n "$PTERODACTYL_URL"
          test -n "$PTERODACTYL_API_KEY"
          test -n "$PTERODACTYL_SERVER_ID"

      - name: Restart Pterodactyl server
        env:
          PTERODACTYL_URL: ${{ secrets.PTERODACTYL_URL }}
          PTERODACTYL_API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $PTERODACTYL_API_KEY" \
            --header "Accept: Application/vnd.pterodactyl.v1+json" \
            --header "Content-Type: application/json" \
            --data '{"signal":"restart"}' \
            "${PTERODACTYL_URL%/}/api/client/servers/${PTERODACTYL_SERVER_ID}/power"
